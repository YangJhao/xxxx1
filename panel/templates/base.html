<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红龙轻量管理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=20260706-fixed-shell">
{% block styles %}{% endblock %}
</head>
<body>
<aside class="sidebar">
  <div class="brand"><i class="bi bi-hdd-network"></i><span>42IPwin</span></div>
  <nav class="nav flex-column">
    {% for item in nav_items %}
    <a href="{{ item.path }}" class="nav-link">
      <i class="bi {{ {
        'dashboard': 'bi-speedometer2',
        'lines': 'bi-diagram-3',
        'nodes': 'bi-hdd-stack',
        'group_control': 'bi-ui-checks-grid',
        'customers': 'bi-person-lines-fill',
        'pve': 'bi-pc-display',
        'admin_users': 'bi-people',
        'logs': 'bi-clock-history',
        'settings': 'bi-gear'
      }.get(item.key, 'bi-circle') }}"></i> {{ item.label }}
    </a>
    {% endfor %}
  </nav>
  <div class="sidebar-footer">
    <div class="user"><i class="bi bi-person-circle"></i> {{ admin or 'admin' }}</div>
    <div class="app-version">v{{ app_version or '1.0.0.3' }}</div>
    <button id="btnLogout" class="btn btn-sm btn-outline-light w-100 mt-2">
      <i class="bi bi-box-arrow-right"></i> 退出登录
    </button>
  </div>
</aside>
<main class="content">{% block content %}{% endblock %}</main>
<div id="toast-container" class="toast-container"></div>
<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}?v=20260712-cache-bust-actions"></script>
{% block scripts %}{% endblock %}
</body>
</html>
