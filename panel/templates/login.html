<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红龙轻量管理</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.min.css') }}">
<style>
  body {
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .login-card {
    width: 380px;
    background: rgba(15, 25, 35, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 40px 32px;
    color: #e6edf3;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .login-card h1 {
    text-align: center; font-size: 28px; margin-bottom: 8px;
    background: linear-gradient(90deg, #4ea1ff, #7e5bef);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .login-card .subtitle { text-align: center; color: #8b949e; margin-bottom: 32px; font-size: 14px;}
  .form-control {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e6edf3; padding: 12px 14px;
  }
  .form-control:focus {
    background: rgba(255,255,255,0.08);
    border-color: #4ea1ff;
    box-shadow: 0 0 0 3px rgba(78,161,255,0.2);
    color: #e6edf3;
  }
  .btn-login {
    background: linear-gradient(90deg, #4ea1ff, #7e5bef);
    border: none; padding: 12px; font-weight: 600;
    width: 100%; border-radius: 8px; color: white; margin-top: 16px;
  }
  .btn-login:hover { opacity: 0.9; color: white;}
  .input-icon { position: relative; }
  .input-icon i {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #8b949e;
  }
  .input-icon input { padding-left: 38px; }
  .alert-err {
    background: rgba(248,81,73,0.15);
    border: 1px solid rgba(248,81,73,0.3);
    color: #ff7b72; padding: 10px 14px; border-radius: 8px;
    font-size: 14px; margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>
<div class="login-card">
  <h1><i class="bi bi-hdd-network-fill"></i> 42IPwin</h1>
  <div class="subtitle">澶欼P SOCKS5 浠ｇ悊 路 绠＄悊鍚庡彴</div>
  <div id="err" class="alert-err"></div>
  <form id="loginForm">
    <div class="mb-3 input-icon">
      <i class="bi bi-person"></i>
      <input type="text" class="form-control" id="username" placeholder="璐﹀彿" value="admin" required>
    </div>
    <div class="mb-3 input-icon">
      <i class="bi bi-lock"></i>
      <input type="password" class="form-control" id="password" placeholder="瀵嗙爜" required>
    </div>
    <button type="submit" class="btn btn-login">鐧?褰?/button>
  </form>
  <div class="subtitle" style="margin-top: 24px; margin-bottom: 0;">
    榛樿璐﹀彿: <code style="color:#4ea1ff">admin / admin123</code>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.style.display = 'none';
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const d = await r.json();
    if (d.ok) {
      window.location.href = '/dashboard';
    } else {
      err.textContent = d.error || '鐧诲綍澶辫触';
      err.style.display = 'block';
    }
  } catch (e) {
    err.textContent = '缃戠粶閿欒: ' + e.message;
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
