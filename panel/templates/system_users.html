{% extends "base.html" %}
{% block title %}用户管理 - 42IPwin{% endblock %}
{% block content %}
<div class="mgmt-page">
  <div class="page-header mgmt-head">
    <div>
      <h2><i class="bi bi-people"></i> 用户管理</h2>
      <p>管理后台登录账号、角色和菜单权限。</p>
    </div>
  </div>

  <div class="mgmt-actions">
    <button class="btn btn-primary" id="btnNewAdmin"><i class="bi bi-person-plus"></i> 新建用户</button>
  </div>

  <section class="mgmt-section">
    <div class="mgmt-section-head">
      <h5>后台用户列表</h5>
      <span id="adminCount">0 个用户</span>
    </div>
    <div class="mgmt-table-wrap">
      <table class="line-table centered-table mgmt-table admin-mgmt-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>账号</th>
            <th>显示名</th>
            <th>角色</th>
            <th>权限</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="adminTable"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal fade" id="adminModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content modal-dark batch-action-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="adminModalTitle">新建用户</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="adminId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">账号</label>
            <input class="form-control" id="adminUsername" autocomplete="off">
          </div>
          <div class="col-md-6">
            <label class="form-label">显示名</label>
            <input class="form-control" id="adminDisplayName" autocomplete="off">
          </div>
          <div class="col-md-6">
            <label class="form-label">角色</label>
            <select class="form-select" id="adminRole">
              <option value="普通管理员">普通管理员</option>
              <option value="普通用户">普通用户</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">密码</label>
            <input class="form-control" id="adminPassword" type="password" placeholder="编辑时留空不修改">
          </div>
        </div>
        <div class="permission-panel mt-3">
          <div class="permission-head">
            <span>权限配置</span>
            <button type="button" class="mini-btn" id="btnCheckAllPerms">全选</button>
          </div>
          <div class="permission-grid" id="permissionGrid"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="btnSaveAdmin">保存</button>
        <button class="btn btn-soft" data-bs-dismiss="modal">取消</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let adminRows = [];
let permissionItems = [];

function formatDateTime(value) {
  if (!value) return '-';
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
}

function permissionLabels(row) {
  if (row.is_super) return '<span class="metric-pill metric-free">全部权限</span>';
  const keys = String(row.permissions || '').split(',').filter(Boolean);
  if (!keys.length) return '<span class="text-muted">-</span>';
  const map = Object.fromEntries(permissionItems.map(x => [x.key, x.label]));
  return keys.map(k => `<span class="perm-chip">${escapeHtml(map[k] || k)}</span>`).join('');
}

function renderPermissionGrid(selected = []) {
  const set = new Set(selected);
  $('#permissionGrid').html(permissionItems.map(item => `
    <label class="perm-check">
      <input type="checkbox" value="${escapeHtml(item.key)}" ${set.has(item.key) ? 'checked' : ''}>
      <span>${escapeHtml(item.label)}</span>
    </label>
  `).join(''));
}

async function loadAdmins() {
  const r = await api.get('/api/admin-users');
  if (!r.ok) return toast(r.error || '读取用户失败', 'error');
  adminRows = r.data || [];
  permissionItems = r.permissions || [];
  $('#adminCount').text(`${adminRows.length} 个用户`);
  const tb = $('#adminTable').empty();
  if (!adminRows.length) return tb.append('<tr><td colspan="8" class="empty-cell">暂无用户</td></tr>');
  adminRows.forEach(u => tb.append(`
    <tr>
      <td>${u.id}</td>
      <td class="strong-cell">${escapeHtml(u.username)}</td>
      <td>${escapeHtml(u.display_name || '-')}</td>
      <td>${escapeHtml(u.role || '-')}</td>
      <td class="text-start">${permissionLabels(u)}</td>
      <td><button class="state-pill ${u.status ? 'on' : 'off'} clickable" onclick="toggleAdmin(${u.id})" ${u.is_super ? 'disabled' : ''}>${u.status ? '启用' : '停用'}</button></td>
      <td>${escapeHtml(formatDateTime(u.created_at))}</td>
      <td class="line-actions">
        <button class="mini-btn" onclick="editAdmin(${u.id})" ${u.is_super ? 'disabled' : ''}>修改</button>
        <button class="mini-btn danger" onclick="deleteAdmin(${u.id})" ${u.is_super ? 'disabled' : ''}>删除</button>
      </td>
    </tr>
  `));
}

function openAdminModal(row = null) {
  $('#adminModalTitle').text(row ? '修改用户' : '新建用户');
  $('#adminId').val(row ? row.id : '');
  $('#adminUsername').val(row ? row.username : '').prop('disabled', !!row);
  $('#adminDisplayName').val(row ? row.display_name : '');
  $('#adminRole').val(row ? (row.role === '普通管理员' ? '普通管理员' : '普通用户') : '普通用户');
  $('#adminPassword').val('');
  renderPermissionGrid(row ? String(row.permissions || '').split(',').filter(Boolean) : ['dashboard', 'lines', 'nodes', 'customers']);
  new bootstrap.Modal(document.getElementById('adminModal')).show();
}

window.editAdmin = id => openAdminModal(adminRows.find(x => x.id === id));

async function saveAdmin() {
  const id = $('#adminId').val();
  const permissions = $('#permissionGrid input:checked').map((_, el) => el.value).get().join(',');
  const data = {
    username: $('#adminUsername').val().trim(),
    display_name: $('#adminDisplayName').val().trim(),
    role: $('#adminRole').val(),
    password: $('#adminPassword').val(),
    permissions,
  };
  if (!id && (!data.username || data.password.length < 6)) return toast('账号必填，密码至少 6 位', 'error');
  const r = id ? await api.put(`/api/admin-users/${id}`, data) : await api.post('/api/admin-users', data);
  if (!r.ok) return toast(r.error || '保存失败', 'error');
  bootstrap.Modal.getInstance(document.getElementById('adminModal'))?.hide();
  toast('用户已保存', 'success');
  await loadAdmins();
}

window.toggleAdmin = async function(id) {
  const r = await api.post(`/api/admin-users/${id}/toggle`, {});
  if (!r.ok) return toast(r.error || '操作失败', 'error');
  await loadAdmins();
};

window.deleteAdmin = async function(id) {
  if (!confirm('确定删除这个用户？')) return;
  const r = await api.del(`/api/admin-users/${id}`);
  if (!r.ok) return toast(r.error || '删除失败', 'error');
  await loadAdmins();
};

$(async () => {
  await loadAdmins();
  $('#btnNewAdmin').on('click', () => openAdminModal());
  $('#btnSaveAdmin').on('click', saveAdmin);
  $('#btnCheckAllPerms').on('click', () => $('#permissionGrid input').prop('checked', true));
});
</script>
{% endblock %}
